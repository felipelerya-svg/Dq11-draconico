<style>
/* Layout: janelas de menu no estilo Dragon Quest. HUD fixo no topo com o nível do grupo e o status, abas fixas embaixo, conteúdo em janelas empilhadas. Tema único e escuro por escolha. */
:root{
  --bg:#060a24; --win-a:#12288a; --win-b:#0a1858; --edge:#eef1ff;
  --ink:#f4f6ff; --mute:#a9b7ef; --gold:#ffd95a; --ok:#7ee2a8; --warn:#ffb54a; --bad:#ff7a7a;
  --line:#2c42a6; --fld:#071246;
  --px:'DotGothic16','Courier New',monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--win-b);z-index:20}
.px{font-family:var(--px);letter-spacing:.04em}
a{color:var(--gold)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HUD fixo */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:linear-gradient(180deg,var(--win-a),var(--win-b));border-bottom:2px solid var(--edge)}
.hud-in{max-width:760px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.lvbox{display:flex;align-items:center;gap:6px}
.lvtag{font-size:20px;color:var(--gold)}
.step{width:40px;height:40px;border:2px solid var(--edge);border-radius:6px;background:var(--fld);font-size:22px;line-height:1;cursor:pointer}
.step:active{background:var(--line)}
.lvnum{width:72px;height:40px;text-align:center;font-size:28px;border:2px solid var(--edge);border-radius:6px;background:var(--fld);color:var(--gold);padding:0;-moz-appearance:textfield}
.lvnum::-webkit-outer-spin-button,.lvnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hsub{flex:1 1 100%;font-size:13px;color:var(--mute);min-width:0}
.hsub b{color:var(--ink);font-weight:600}
.pill{font:13px var(--px);letter-spacing:.06em;padding:4px 9px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.low{color:var(--warn)} .pill.cap{color:var(--bad)} .pill.high{color:var(--mute)} .pill.none{color:var(--mute)}

/* Conteúdo */
.wrap{max-width:760px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.win{background:linear-gradient(180deg,var(--win-a),var(--win-b));border:2px solid var(--edge);border-radius:8px;box-shadow:inset 0 0 0 2px var(--win-b);padding:12px 14px;min-width:0}
.win h2{margin:0 0 6px;font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.win p{margin:0 0 8px}
.win p:last-child{margin-bottom:0}
.mute{color:var(--mute)}
.small{font-size:13px}

/* Abas fixas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--win-b);border-top:2px solid var(--edge);display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{min-height:46px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--mute);font-size:12px;font-weight:500;cursor:pointer;padding:4px 0;min-width:0}
.tab[aria-current="page"]{color:var(--gold);border-color:var(--gold);background:var(--fld);font-weight:600}

/* Marcos */
.marker.done{opacity:.6}
.marker.next{border-color:var(--gold)}
.mhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.mhead label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.mhead input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;flex:none}
.mname{font-weight:600;overflow-wrap:anywhere}
.badge{font:11px var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.badge.key{border-color:var(--bad);color:var(--bad)}
.nums{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0 30px;font-size:13px;color:var(--mute)}
.nums b{color:var(--gold);font-family:var(--px);font-weight:400;font-size:15px}
.track{position:relative;height:12px;background:var(--fld);border:1px solid var(--line);border-radius:2px;margin:12px 0 4px 30px}
.band{position:absolute;top:0;bottom:0;background:rgba(255,217,90,.32);border-left:2px solid var(--gold);border-right:2px solid var(--gold)}
.capmk{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--bad)}
.needle{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px #000}
.scale{display:flex;justify-content:space-between;margin-left:30px;font:11px var(--px);color:var(--mute)}
.mstat{margin:8px 0 0 30px;font-size:13px}
.mstat.ok{color:var(--ok)} .mstat.low{color:var(--warn)} .mstat.cap{color:var(--bad)}
.mnote{margin:6px 0 0 30px;font-size:13px;color:var(--mute)}
.srcs{margin:4px 0 0 30px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge.c-alta{border-color:var(--ok);color:var(--ok)}
.badge.c-media{border-color:var(--gold);color:var(--gold)}
.badge.c-baixa{border-color:var(--warn);color:var(--warn)}
.rbar{position:relative;height:6px;margin:0 0 2px 30px}
.rbar i{position:absolute;top:1px;height:4px;background:var(--mute);border-radius:2px}
.ticks{position:relative;height:16px;margin-left:30px;font:11px var(--px);color:var(--mute)}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
tr.cur td{color:var(--gold)}
.marker.here{border-color:var(--ok)}
.gmark{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ok)}
.chapcard .nums,.chapcard .track,.chapcard .rbar,.chapcard .ticks,.chapcard .mstat,.chapcard .mnote,.chapcard .chap-b,.chapcard .concord{margin-left:0}
.chap-b{margin:6px 0 0 0;font-size:13px;overflow-wrap:anywhere}
.concord{margin:6px 0 0 0;font-size:12px;color:var(--mute)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .btn{grid-column:1/-1;justify-self:start}

/* ---------- Utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function fmt(n){return (n>0?'+':'')+n;}
function pct(l){return (clamp(l,1,MAXL)-1)/(MAXL-1)*100;}
function plural(n,a,b){return n===1?a:b;}

function tagsOf(w){
  var n=norm(w),t=[];
  if(n.indexOf('chave magica')>-1)t.push('chave');
  if(n.indexOf('medalhinha')>-1)t.push('medalhas');
  if(n.indexOf('cassino')>-1)t.push('cassino');
  if(n.indexOf('quest #')>-1)t.push('quest');
  if(n.indexOf('estacao da baleia')>-1)t.push('baleia');
  return t;
}
var REC=RAW.map(function(l,i){var p=l.split('|');return {id:'r'+i,p:+p[0],b:p[1],w:p[2],u:p[3],t:tagsOf(p[2])};});
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);}
function placeOf(w){
  var p=w.split(',')[0].trim();
  if(/medalhinhas$/.test(p))return 'Medalhinhas';
  if(p==='Posto de controle de Laguna di Gondolia')p='Laguna di Gondolia';
  return p.replace(/^Região de /,'');
}

REC.forEach(function(r){

  r.pl=placeOf(r.w);
  r.how=r.pl==='Medalhinhas'?r.w:(i>-1?r.w.slice(i+1).trim():'');

});

var DEF={v:1,level:1,tol:2,chap:0,adj1:0,adj2:4,phase:0,semcomp:0,item:{},done:{},rec:{},logs:[],chk:{},updatedAt:0};
function cloneDef(){return JSON.parse(JSON.stringify(DEF));}
function sanitize(o){
  var d=cloneDef();
  if(!o||typeof o!=='object')return d;
  if(isFinite(o.level))d.level=clamp(Math.round(o.level),1,99);
  if(isFinite(o.tol))d.tol=clamp(Math.round(o.tol),0,4);
  if(isFinite(o.chap))d.chap=clamp(Math.round(o.chap),0,20);
  if(isFinite(o.adj1))d.adj1=clamp(Math.round(o.adj1),-6,10);
  if(isFinite(o.adj2))d.adj2=clamp(Math.round(o.adj2),-6,10);
  if(isFinite(o.phase))d.phase=clamp(Math.round(o.phase),0,5);
  if(o.semcomp===0||o.semcomp===1)d.semcomp=o.semcomp;
  if(o.item&&typeof o.item==='object'&&!Array.isArray(o.item)){Object.keys(o.item).forEach(function(k){var x=o.item[k];if((x===1||x===2)&&/^[a-z0-9-]{1,48}$/.test(k))d.item[k]=x;});}
  ['done','rec','chk'].forEach(function(k){
    var s=o[k];
    if(s&&typeof s==='object'&&!Array.isArray(s)){
      Object.keys(s).forEach(function(kk){if(s[kk]===true&&/^[A-Za-z0-9_-]{1,40}$/.test(kk))d[k][kk]=true;});
    }
  });
  if(Array.isArray(o.logs)){
    d.logs=o.logs.slice(-200).filter(function(l){return l&&typeof l.boss==='string'&&OUT[l.out];}).map(function(l){
      return {id:String(l.id||('l'+Math.random())).slice(0,40),boss:l.boss.slice(0,60),lv:clamp(Math.round(+l.lv)||1,1,99),out:l.out,note:String(l.note||'').slice(0,140),on:l.on!==false,t:+l.t||0};
    });
  }
  if(isFinite(o.updatedAt))d.updatedAt=+o.updatedAt;
  return d;
}
function localLoad(){try{var t=localStorage.getItem(KEY);if(t)return sanitize(JSON.parse(t));}catch(e){}return cloneDef();}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Sincronização entre aparelhos (db privado por pessoa) ---------- */
var ref=null,wTimer=0,writing=false,dirty=false,synced=false,syncState='local';
var SYNCTXT={local:'Salvo só neste aparelho',wait:'Conectando à sincronização…',slow:'Sincronização lenta; usando o que está neste aparelho',sync:'Sincronizado entre seus aparelhos',err:'Sincronização com erro; seu progresso continua salvo neste aparelho'};
function setSync(s){syncState=s;var e=$('#syncline');if(e)e.textContent=SYNCTXT[s];}
function scheduleRemote(){dirty=true;clearTimeout(wTimer);wTimer=setTimeout(flush,700);}
function flush(){
  if(!ref||writing||!dirty)return;
  writing=true;dirty=false;
  ref.set({updatedAt:S.updatedAt,state:JSON.stringify(S)}).then(function(){writing=false;if(dirty)flush();},function(){writing=false;setSync('err');});
}
function save(){S.updatedAt=Date.now();localSave();scheduleRemote();}
function initSync(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      ref=db.doc('data/users/'+id+'/hud');
      setSync('wait');
      var to=setTimeout(function(){if(!synced)setSync('slow');},10000);
      ref.onSnapshot(function(snap){
        var fromCache=snap.metadata&&snap.metadata.fromCache;
        if(!fromCache){synced=true;clearTimeout(to);}
        var d=snap.exists?snap.data():null;
        if(d&&typeof d.state==='string'&&+d.updatedAt>S.updatedAt){
          try{S=sanitize(JSON.parse(d.state));S.updatedAt=+d.updatedAt;localSave();renderAll();}catch(e){}
        }else if(!fromCache&&S.updatedAt>0&&(!d||+d.updatedAt<S.updatedAt)){
          scheduleRemote();
        }
        setSync(fromCache?'wait':'sync');
      },function(){clearTimeout(to);setSync('err');});
    });
  }).catch(function(){setSync('local');});
}

/* ---------- Regras de nível ---------- */
function calib(){var s=0;S.logs.forEach(function(l){if(l.on!==false)s+=DELTA[l.out]||0;});return clamp(s,-4,6);}
function bandOf(m){var c=Math.round((m.lo+m.hi)/2)+calib();return {c:c,lo:Math.max(1,c-S.tol),hi:c+S.tol};}
function nextMarker(){for(var i=0;i<MARKERS.length;i++)if(!S.done[MARKERS[i].id])return MARKERS[i];return null;}
function statusFor(m){
  var b=bandOf(m),L=S.level;
  if(L<b.lo)return {k:'low',d:b.lo-L,t:'ABAIXO'};
  if(L<=b.hi)return {k:'ok',d:0,t:'NA FAIXA'};
  return m.key?{k:'cap',d:L-b.hi,t:'ACIMA DO TETO'}:{k:'high',d:L-b.hi,t:'ACIMA'};
}

/* ---------- Capítulos ---------- */
function chapBase(c){return c.g2||c.g;}
function chapAdj(c){return c.ato===1?S.adj1:(c.ato===2?S.adj2:0);}
function chapBand(c){var m=chapBase(c)+chapAdj(c)+calib();return {c:m,lo:Math.max(1,m-S.tol),hi:m+S.tol};}
function curChap(){for(var i=0;i<CHAPS.length;i++)if(CHAPS[i].n===S.chap)return CHAPS[i];return null;}
function chapStatus(c){var b=chapBand(c),L=S.level;if(L<b.lo)return {k:'low',d:b.lo-L};if(L<=b.hi)return {k:'ok',d:0};return c.key?{k:'cap',d:L-b.hi}:{k:'high',d:L-b.hi};}
function ctr(r){return (r[0]+r[1])/2;}
function concord(c){
  var v=[c.g2?(c.g+c.g2)/2:c.g];
  if(c.r)v.push(ctr(c.r));
  if(c.s)v.push(ctr(c.s));
  if(c.x)v.push(ctr(c.x));
  var k=v.length,sp=Math.round((Math.max.apply(null,v)-Math.min.apply(null,v))*10)/10;
  var lab=k===1?'só Game8':((k>=3&&sp<=4)?'alta':(sp<=6?'média':'baixa'));
  return {k:k,sp:sp,lab:lab};
}
function recCount(q){var n=norm(q);return REC.filter(function(r){return norm(r.b+' '+r.w+' '+r.u).indexOf(n)>-1;}).length;}

function jumpTo(id){
  var el=document.getElementById(id);if(!el)return false;
  var hud=$('#hud'),top=0;
  if(hud){var st=0;try{st=parseFloat(getComputedStyle(hud).top)||0;}catch(e){}top=hud.offsetHeight+st;}
  var y=Math.max(0,el.getBoundingClientRect().top+window.scrollY-top-8);
  var calm=false;try{calm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){}
  try{window.scrollTo({top:y,behavior:calm?'auto':'smooth'});}catch(e){window.scrollTo(0,y);}
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  setTimeout(function(){el.classList.remove('flash');},1600);
  return true;
}
function tocRow(id,n,name,mt,st,here){

function tocStat(st,done){
  if(done)return ['superado','high'];

  if(st.k==='low')return ['faltam '+st.d,'low'];

function sumCap(){

function anchored(el,fn){

var TAGN={L:'Loja',P:'Ponto',B:'Baú/pote',T:'Troca',Q:'Quest',D:'Drop'};
var BYITEM={},USEN=[],USEL=[],HAY=[],MON={},MONL=[];
(function(){
  MAT.forEach(function(){USEN.push(0);USEL.push([]);});
  RCP.forEach(function(r,ri){
    if(r[3])BYITEM[r[3]]=ri;
    r[4].forEach(function(x){USEL[x[0]].push([ri,x[1]]);if(r[3])USEN[x[0]]++;});
  });
  USEL.forEach(function(a){a.sort(function(x,y){
    var ax=RCP[x[0]][3],ay=RCP[y[0]][3],px=ax&&ITEMS[ax]?ITEMS[ax].r.p:9,py=ay&&ITEMS[ay]?ITEMS[ay].r.p:9;
    return px-py||x[0]-y[0];
  });});
  MAT.forEach(function(m,i){
    HAY[i]=norm([m.n].concat(m.l,m.p,m.b,m.t,m.q,m.d.map(function(d){return d[0];}),USEL[i].map(function(u){return RCP[u[0]][1];})).join(' '));
    m.d.forEach(function(d){
      var k=d[0].toLowerCase(),o=MON[k];
      if(!o){o=MON[k]={n:d[0],m:[]};MONL.push(o);}
      o.m.push([i,d[1],d[2]]);

  });
})();

function needInfo(){

function matMatch(i,q,need){
  var m=MAT[i];

function matSort(a,b,need){
  var A=MAT[a],B=MAT[b];
  if(need.n){var na=need.tot[a]?1:0,nb=need.tot[b]?1:0;if(na!==nb)return nb-na;}
  var byName=A.n<B.n?-1:(A.n>B.n?1:0);
  if(ui.ms==='az')return byName;

}

function refreshKeep(){var y=window.scrollY;showTab(ui.tab);window.scrollTo(0,y);}
var rstTimer=0;
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  if(a==='tab'){showTab(id);}
  else if(a==='lv-'){stepLevel(-1);}
  else if(a==='lv+'){stepLevel(1);}
  else if(a==='ph'){ui.ph=+v;syncChips();renderRecList();}
  else if(a==='myph'){S.phase=(S.phase===+v?0:+v);save();syncChips();renderRecList();}
  else if(a==='rview'){ui.rview=v;syncChips();renderRecList();}
  else if(a==='alvo'){ui.alvo=!ui.alvo;syncChips();renderRecList();}
  else if(a==='item'){anchored(el,function(){var c=S.item[id]||0,n=(c+1)%3;if(n)S.item[id]=n;else delete S.item[id];save();renderRecList();});}
  else if(a==='itemx'){delete S.item[id];save();renderRecList();}
  else if(a==='tag'){var i=ui.tags.indexOf(v);if(i>-1)ui.tags.splice(i,1);else ui.tags.push(v);syncChips();renderRecList();}
  else if(a==='rmode'){ui.rmode=v;showTab('regua');}
  else if(a==='chap'){S.chap=(S.chap===+id?0:+id);save();renderHud();refreshKeep();}
  else if(a==='jump'){syncView();jumpTo(id);}
  else if(a==='toc'){syncView();jumpTo('toc');}
  else if(a==='me'){syncView();goMe(v==='hud');}
  else if(a==='mm'){ui.mm=v;ui.mlim=60;syncMat();renderMat();}
  else if(a==='mf'){ui.mf[v]=!ui.mf[v];ui.mlim=60;syncMat();renderMat();}
  else if(a==='ms'){ui.ms=v;syncMat();renderMat();}
  else if(a==='noshop'){S.semcomp=S.semcomp?0:1;save();syncMat();renderMat();}
  else if(a==='mmore'){ui.mlim+=60;renderMat();}
  else if(a==='mmon'){ui.mm='mon';ui.mq=v;ui.mlim=60;showTab('materiais');}
  else if(a==='mmat'){ui.mm='mat';ui.mq=v;showTab('materiais');}
  else if(a==='mitem'){
    var top=el.getBoundingClientRect().top;
    var c0=S.item[id]||0,n0=(c0+1)%3;if(n0)S.item[id]=n0;else delete S.item[id];
    save();renderMat();
    var nn=document.querySelector('#mlist details[data-i="'+v+'"] [data-act="mitem"][data-id="'+id+'"]');
    if(nn)window.scrollBy(0,nn.getBoundingClientRect().top-top);
  }
  else if(a==='arec'){ui.q=v;ui.ph=0;ui.tags=[];ui.alvo=false;ui.hide=false;showTab('receitas');}
  else if(a==='adj'){S[id]=clamp(S[id]+(+v),-6,10);save();var av=$('#'+id+'v');if(av)av.textContent=fmt(S[id]);var ex2=$('#exp');if(ex2)ex2.value=JSON.stringify(S);renderHud();}
  else if(a==='dev'){
    if(id==='awake'){DEV.awake=DEV.awake?0:1;saveDev();if(DEV.awake)wakeOn();else wakeOff();}
    else if(id==='vib'){DEV.vib=DEV.vib?0:1;saveDev();if(DEV.vib&&NAV.vibrate){try{NAV.vibrate(60);}catch(err){}}}
    else if(id==='fs'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(err){}}
    refreshKeep();
  }
  else if(a==='chk-reset'){S.chk={};save();refreshKeep();}
  else if(a==='calib-reset'){S.logs.forEach(function(l){l.on=false;});save();renderLogs();renderHud();}
  else if(a==='log-del'){S.logs=S.logs.filter(function(l){return l.id!==id;});save();renderLogs();renderHud();}
  else if(a==='tol-'||a==='tol+'){S.tol=clamp(S.tol+(a==='tol+'?1:-1),0,4);save();var t=$('#tolv');if(t)t.textContent='±'+S.tol;var ex=$('#exp');if(ex)ex.value=JSON.stringify(S);renderHud();}
  else if(a==='copy'){
    var ta=$('#exp'),msg=$('#copymsg');
    var ok=function(){msg.textContent='Copiado.';};
    var fb=function(){ta.focus();ta.select();msg.textContent='Selecionado. Copie manualmente.';};

  }
  else if(a==='import'){
    var im=$('#imp'),mm=$('#impmsg');
    try{var o=JSON.parse(im.value);if(!o||typeof o!=='object'||typeof o.v!=='number')throw 0;S=sanitize(o);save();renderAll();}
    catch(err){mm.textContent='Backup inválido. Cole o texto exportado completo.';}
  }
  else if(a==='reset'){
    if(el.getAttribute('data-armed')==='1'){S=cloneDef();save();renderAll();}
    else{el.setAttribute('data-armed','1');el.textContent='Toque de novo para confirmar';clearTimeout(rstTimer);rstTimer=setTimeout(function(){el.removeAttribute('data-armed');el.textContent='Apagar todo o progresso';},4000);}
  }
});
